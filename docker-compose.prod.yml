version: "3.9"

# Production compose - all services on a single t3.small EC2 instance.
# Environment variables are loaded from /home/ec2-user/.env (written at boot
# by user-data from SSM Parameter Store).
#
# Deploy: push image to ECR, then on the instance run:
#   docker compose pull && docker compose up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nhl
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: nhl_draft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhl -d nhl_draft"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    # ECR_REGISTRY and IMAGE_TAG are set in /home/ec2-user/.env by the CI deploy
    # script (derived from instance metadata + github.sha). No hardcoded fallback
    # so a misconfigured deploy fails loudly instead of pulling a stale image.
    image: ${ECR_REGISTRY}/nhl-draft-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /home/ec2-user/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql+psycopg2://nhl:${DB_PASSWORD}@db:5432/nhl_draft
      REDIS_URL: redis://redis:6379/0
    ports:
      - "80:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8000/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # Migrations are run separately by the CI workflow via SSM before this
    # container is (re)started, so we start uvicorn directly here.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --timeout-keep-alive 120
      --log-level info
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
