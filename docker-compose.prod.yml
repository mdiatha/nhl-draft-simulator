version: "3.9"

# Production compose — DB is managed by RDS, not Docker.
# Runs only the FastAPI backend + Ollama on EC2.
#
# Required environment variables (set in /home/ec2-user/.env):
#   AWS_SECRETS_NAME  — Secrets Manager secret name (nhl-draft/production)
#   AWS_S3_BUCKET     — S3 bucket for model artifacts
#   AWS_REGION        — AWS region (e.g. us-east-1)
#   APP_ENV           — set to "production"
#
# DATABASE_URL is loaded from Secrets Manager at startup by backend/app/aws/secrets.py.
# API keys (Anthropic, Secret Key, Admin Key) are loaded from SSM Parameter Store.
#
# NOTE: Ollama (nomic-embed-text) requires ~500MB RAM. On a t3.micro (1GB total)
# this is tight — consider upgrading to t3.small (2GB) for comfortable headroom.
# On first deploy, pull the model:
#   docker compose -f docker-compose.prod.yml exec ollama ollama pull nomic-embed-text

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Keep Ollama internal — not exposed to the host in prod.
    deploy:
      resources:
        limits:
          memory: 600m
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: ${ECR_REGISTRY}/nhl-draft-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /home/ec2-user/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    # Single Uvicorn worker — t3.micro has 1 vCPU.
    # Async I/O handles concurrent SSE streams (Claude agent, draft summaries)
    # without blocking. No Redis pub/sub fan-out needed with a single process.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --timeout-keep-alive 120
      --log-level info
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  ollama_data:
